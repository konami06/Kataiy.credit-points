<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Katay.credit-points</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f6f7fb;
  color:#222;
}

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-box{
  width:100%;
  max-width:420px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.08);
}

.login-box h1{
  margin-top:0;
  text-align:center;
}

.login-box p{
  text-align:center;
  color:#777;
}

input,button{
  width:100%;
  padding:13px;
  border-radius:10px;
  font-size:15px;
}

input{
  border:1px solid #ddd;
  margin-bottom:12px;
}

button{
  border:0;
  background:#111;
  color:white;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.error{
  color:#d00;
  text-align:center;
  margin-top:10px;
}

#adminPage{
  display:none;
}

header{
  background:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:20px;
  font-weight:bold;
}

.logout{
  width:auto;
  padding:9px 15px;
  background:#eee;
  color:#222;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

.card small{
  color:#777;
}

.card strong{
  display:block;
  font-size:28px;
  margin-top:8px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-bottom:20px;
}

.tab{
  width:auto;
  white-space:nowrap;
  background:white;
  color:#222;
  border:1px solid #ddd;
}

.tab.active{
  background:#111;
  color:white;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.panel{
  background:white;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.05);
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
}

.action{
  width:auto;
  padding:7px 12px;
  margin:2px;
}

.plus{
  background:#16803c;
}

.minus{
  background:#d22;
}

@media(max-width:800px){
  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  table{
    font-size:13px;
  }
}

@media(max-width:500px){
  .cards{
    grid-template-columns:1fr 1fr;
  }

  .container{
    padding:12px;
  }
}
  
/* ===== KATAY CREDIT-POINTS ADMIN STYLE ===== */

body {
  background: linear-gradient(135deg, #fff0f8, #f8edff);
  color: #555;
  font-family: Arial, sans-serif;
}

header {
  background: linear-gradient(90deg, #ff4fa3, #9b5de5);
  color: white;
  border: none;
  border-radius: 0 0 22px 22px;
  padding: 18px 22px;
  box-shadow: 0 5px 18px rgba(220, 80, 160, 0.2);
}

header h1 {
  margin: 0;
  font-size: 22px;
}

.container {
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}

.cards {
  gap: 18px;
}

.card {
  background: rgba(255,255,255,0.95);
  border: 1px solid #ffd1e7;
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 5px 18px rgba(180, 100, 180, 0.12);
}

button {
  border: none;
  border-radius: 12px;
  padding: 10px 18px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  transform: translateY(-1px);
  opacity: 0.9;
}

table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  overflow: hidden;
  background: white;
  border-radius: 18px;
  box-shadow: 0 5px 18px rgba(180, 100, 180, 0.1);
}

th {
  background: #f7d7eb;
  color: #8b3d70;
  padding: 13px;
}

td {
  padding: 13px;
  border-bottom: 1px solid #f1e1eb;
}

input {
  border: 1px solid #e8b9d2;
  border-radius: 12px;
  padding: 12px;
  outline: none;
}

input:focus {
  border-color: #e85aa5;
  box-shadow: 0 0 0 3px rgba(232,90,165,0.12);
}

#adminPage {
  background: transparent;
}

#loginPage {
  background: linear-gradient(135deg, #fff0f8, #f3e8ff);
}

.login-box {
  border: 2px solid #ffd0e6;
  box-shadow: 0 10px 35px rgba(190, 80, 160, 0.18);
}

.login-box h1 {
  color: #d83d91;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">
  <div class="login-box">
    <h1>🐰 Katay.credit-points</h1>
    <p>Admin Login</p>

    <input
      id="email"
      type="email"
      placeholder="Gmail"
    >

    <input
      id="password"
      type="password"
      placeholder="รหัสผ่าน"
    >

    <button onclick="login()">เข้าสู่ระบบ</button>

    <div id="loginError" class="error"></div>
  </div>
</div>


<!-- ADMIN -->
<div id="adminPage">

<header>
  <div class="logo">🐰 Katay.credit-points Admin</div>
  <button class="logout" onclick="logout()">ออกจากระบบ</button>
</header>

<div class="container">

  <!-- DASHBOARD -->
  <div class="cards">

    <div class="card">
      <small>ลูกค้าทั้งหมด</small>
      <strong id="customerCount">0</strong>
    </div>

    <div class="card">
      <small>เครดิตรวม</small>
      <strong id="creditTotal">0</strong>
    </div>

    <div class="card">
      <small>จำนวน +1</small>
      <strong id="plusCount">0</strong>
    </div>

    <div class="card">
      <small>จำนวน -1</small>
      <strong id="minusCount">0</strong>
    </div>

  </div>


  <!-- TABS -->
  <div class="tabs">

    <button
      class="tab active"
      onclick="showTab('customers',this)">
      👥 ลูกค้า
    </button>

    <button
      class="tab"
      onclick="showTab('reviews',this)">
      ⭐ รีวิว
    </button>

    <button
      class="tab"
      onclick="showTab('credits',this)">
      💳 เครดิต
    </button>

  </div>


  <!-- CUSTOMERS -->
  <div id="customers" class="section active">

    <div class="panel">

      <h2>👥 ลูกค้า</h2>

      <table>

        <thead>
          <tr>
            <th>ชื่อ</th>
            <th>points</th>
            <th>จัดการ</th>
          </tr>
        </thead>

        <tbody id="customerTable">
        </tbody>

      </table>

    </div>

  </div>


  <!-- REVIEWS -->
  <div id="reviews" class="section">

    <div class="panel">

      <h2>⭐ รีวิว</h2>

      <table>

        <thead>
          <tr>
            <th>ลูกค้า</th>
            <th>ข้อความ</th>
            <th>คะแนน</th>
          </tr>
        </thead>

        <tbody id="reviewTable">
        </tbody>

      </table>

    </div>

  </div>


  <!-- CREDITS -->
  <div id="credits" class="section">

    <div class="panel">

      <h2>💳 จัดการเครดิต</h2>

      <p>
        เลือกลูกค้าแล้วกด +1 เพื่อเพิ่มเครดิต
        หรือ -1 เพื่อหักเครดิต
      </p>

      <div id="creditList"></div>

    </div>

  </div>

</div>
</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  doc,
  updateDoc,
  increment
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/*
========================================
ใส่ Firebase Config ของโปรเจกต์ตรงนี้
========================================
*/

const firebaseConfig = {
  apiKey: "AIzaSyDaoT5VBuF7O0MQKAqQb_HXxu0WcUwAjjc",
  authDomain: "credit-kt.firebaseapp.com",
  projectId: "credit-kt",
  storageBucket: "credit-kt.firebasestorage.app",
  messagingSenderId: "835466366736",
  appId: "1:835466366736:web:3fa824d0fea4c23ef75f95"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* LOGIN */

window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("loginError");

  error.textContent = "";

  if(!email || !password){
    error.textContent =
      "กรุณากรอก Gmail และรหัสผ่าน";
    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    console.error(e);

    error.textContent =
      "Gmail หรือรหัสผ่านไม่ถูกต้อง";

  }

};


/* LOGOUT */

window.logout = async function(){

  await signOut(auth);

};


/* AUTH */

onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById("loginPage").style.display="none";

    document.getElementById("adminPage").style.display="block";

    loadCustomers();
    loadReviews();

  }else{

    document.getElementById("loginPage").style.display="flex";

    document.getElementById("adminPage").style.display="none";

  }

});


/* TAB */

window.showTab = function(id,button){

  document
    .querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

  document
    .querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));

  document
    .getElementById(id)
    .classList.add("active");

  button.classList.add("active");

};


/* CUSTOMERS */

async function loadCustomers(){

  const table =
    document.getElementById("customerTable");

  const creditList =
    document.getElementById("creditList");

  table.innerHTML="";
  creditList.innerHTML="";

  let count=0;
  let total=0;

  try{

    const snapshot =
      await getDocs(collection(db,"customers"));

    snapshot.forEach((item)=>{

      count++;

      const data=item.data();

      const name =
        data.name ||
        data.email ||
        item.id;

      const credit =
        Number(data.credit || 0);

      total += credit;


      table.innerHTML += `

        <tr>

          <td>${escapeHtml(name)}</td>

          <td>${credit}</td>

          <td>

            <button
              class="action plus"
              onclick="changeCredit('${item.id}',1)">
              +1
            </button>

            <button
              class="action minus"
              onclick="changeCredit('${item.id}',-1)">
              -1
            </button>

          </td>

        </tr>

      `;


      creditList.innerHTML += `

        <div
          style="
          padding:15px;
          border-bottom:1px solid #eee;
          display:flex;
          justify-content:space-between;
          align-items:center;
          gap:10px;
          "
        >

          <div>

            <b>${escapeHtml(name)}</b>

            <div>
              เครดิต:
              <strong>${credit}</strong>
            </div>

          </div>

          <div>

            <button
              class="action plus"
              onclick="changeCredit('${item.id}',1)">
              +1
            </button>

            <button
              class="action minus"
              onclick="changeCredit('${item.id}',-1)">
              -1
            </button>

          </div>

        </div>

      `;

    });


    document.getElementById("customerCount")
      .textContent=count;

    document.getElementById("creditTotal")
      .textContent=total;

  }catch(e){

    console.error(e);

    table.innerHTML=
      "<tr><td colspan='3'>โหลดข้อมูลไม่สำเร็จ</td></tr>";

  }

}


/* CHANGE CREDIT */

window.changeCredit = async function(id,value){

  const text =
    value > 0
      ? "ต้องการเพิ่มเครดิต +1 ใช่ไหม?"
      : "ต้องการหักเครดิต -1 ใช่ไหม?";

  if(!confirm(text)){
    return;
  }

  try{

    await updateDoc(
      doc(db,"customers",id),
      {
        credit: increment(value)
      }
    );

    await loadCustomers();

    alert(
      value > 0
        ? "เพิ่มเครดิตเรียบร้อยแล้ว"
        : "หักเครดิตเรียบร้อยแล้ว"
    );

  }catch(e){

    console.error(e);

    alert(
      "ไม่สามารถแก้เครดิตได้"
    );

  }

};


/* REVIEWS */

async function loadReviews(){

  const table =
    document.getElementById("reviewTable");

  table.innerHTML="";

  try{

    const snapshot =
      await getDocs(collection(db,"reviews"));

    snapshot.forEach((item)=>{

      const data=item.data();

      const name =
        data.name ||
        data.email ||
        "-";

      const message =
        data.message ||
        data.text ||
        "-";

      const rating =
        data.rating ||
        data.score ||
        "-";

      table.innerHTML += `

        <tr>

          <td>${escapeHtml(name)}</td>

          <td>${escapeHtml(message)}</td>

          <td>${escapeHtml(String(rating))}</td>

        </tr>

      `;

    });

  }catch(e){

    console.error(e);

    table.innerHTML=
      "<tr><td colspan='3'>ยังไม่มีข้อมูลรีวิว</td></tr>";

  }

}


/* SECURITY */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
